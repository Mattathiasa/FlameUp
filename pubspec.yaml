name: flameup
description: "FlameUp -- Cook. Discover. Master. Ethiopian cooking, gamified."
publish_to: 'none'

version: 0.1.0+1

environment:
  # Pinned to the Dart shipped with Flutter 3.19.6, the toolchain on this
  # machine. See docs/PROJECT_AUDIT.md section 2.1 for why dependencies below
  # are held at the versions they are.
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Firebase (all held at the generation that resolves on Dart 3.3.4)
  # firebase_core is capped at 3.4.0: later releases pull
  # firebase_core_web >=2.18.0, which requires Dart >=3.4.0.
  firebase_core: 3.4.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0
  firebase_storage: ^12.2.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.0.0
  cloud_functions: ^5.0.0
  firebase_app_check: ^0.3.0

  # Sign-in providers
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  crypto: ^3.0.3

  # Local persistence + offline cache
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Platform + media
  connectivity_plus: ^6.0.5
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  share_plus: ^10.0.0
  url_launcher: ^6.2.6
  package_info_plus: ^8.0.2

  # Utilities
  intl: ^0.18.1   # pinned by flutter_localizations on Flutter 3.19.6
  collection: ^1.18.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.0.1
  firebase_auth_mocks: ^0.14.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/design/

  fonts:
    - family: NotoSansEthiopic
      fonts:
        # Weight 200 is used by exactly one thing -- the 54px cook-mode
        # countdown, where the hairline stroke is the point.
        - asset: assets/fonts/NotoSansEthiopic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansEthiopic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansEthiopic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
