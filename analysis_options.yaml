include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Regenerated by `flutter gen-l10n` from lib/l10n/*.arb -- lint findings
    # here cannot be fixed without editing generated output.
    - lib/l10n/generated/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # A missing translation or an unawaited write is a defect, not advice.
    unawaited_futures: error
    always_use_package_imports: ignore

linter:
  rules:
    # Correctness
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements

    # API shape
    - always_declare_return_types
    - avoid_positional_boolean_parameters
    - prefer_final_locals
    - prefer_single_quotes
    - use_super_parameters

    # Widgets
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box

    # Readability
    - directives_ordering
    - require_trailing_commas
    - sort_child_properties_last
