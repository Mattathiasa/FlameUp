plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.flameup.app"
    compileSdk flutter.compileSdkVersion
    // Pinned rather than taking flutter.ndkVersion: several Firebase plugins
    // require 25.1.8937393 and the Flutter default is older.
    ndkVersion "25.1.8937393"

    compileOptions {
        // flutter_local_notifications needs the desugared java.time APIs for
        // scheduled cooking timers.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.flameup.app"
        // firebase_auth 5.x requires API 23 as its floor.
        minSdkVersion 23
        // Google Play requires 34 for new apps and updates; the Flutter
        // default for this SDK is still 33.
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // The Firebase SDK set pushes the app past the 64k method limit.
        multiDexEnabled true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            // Release signing is configured in Phase 15; until then release
            // builds use the debug keys so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // 2.0.4 is what flutter_local_notifications 17.x expects. It emits
    // desugared-library spec format 200, which AGP 8's L8 understands --
    // AGP 7.3 did not, and failed with "This is not a JSON Array".
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
