      <sc-if value="{{ s.saved }}" hint-placeholder-val="{{ false }}">
      <div style="padding:70px 0 130px;animation:fu-in .4s ease both">
        <div style="padding:0 20px">
          <div style="font:700 33px/1.05 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-1.2px;color:var(--tx,#FFF6EE)">{{ t.savedH1 }}</div>
          <div style="margin-top:8px;font:500 13.5px/1.4 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.savedSub }}</div>
        </div>
        <div style="margin-top:18px;display:flex;gap:10px;overflow-x:auto;padding:0 20px 2px">
          <sc-for list="{{ collections }}" as="c" hint-placeholder-count="3">
            <div style="width:150px;height:72px;flex:none;border-radius:18px;position:relative;overflow:hidden;cursor:pointer;background:{{ c.tile }}">
              <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 70%)"></div>
              <div style="position:absolute;left:12px;bottom:10px;right:12px;font:600 14px/1.15 -apple-system,system-ui,'Noto Sans Ethiopic';color:#fff">{{ c.label }}</div>
            </div>
          </sc-for>
        </div>
        <div style="margin:18px 20px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <sc-for list="{{ saved }}" as="d" hint-placeholder-count="6">
            <div sc-camel-on-click="{{ d.go }}" style="cursor:pointer;border-radius:20px;overflow:hidden;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18)),var(--sh,0 14px 34px rgba(0,0,0,.45))">
              <div style="height:104px;position:relative;background:{{ d.tile }}">
                <div style="position:absolute;inset:0;background:radial-gradient(120% 80% at 24% 10%,rgba(255,255,255,.3),transparent 58%)"></div>
                <div style="position:absolute;right:9px;top:9px;width:26px;height:26px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.32);backdrop-filter:blur(8px);border:.5px solid rgba(255,255,255,.22)">
                  <svg width="10" height="13" sc-camel-view-box="0 0 14 17" fill="none"><path d="M2 1.6h10v13.2L7 11.2l-5 3.6V1.6Z" fill="#fff"></path></svg>
                </div>
              </div>
              <div style="padding:10px 11px 12px">
                <div style="font:600 15px/1.15 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-.35px;color:var(--tx,#FFF6EE)">{{ d.title }}</div>
                <div style="margin-top:6px;font:600 11px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t3,rgba(255,238,226,.36))">{{ d.time }}</div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
      </sc-if>
