      <sc-if value="{{ s.feed }}" hint-placeholder-val="{{ false }}">
      <div style="padding:70px 20px 130px;animation:fu-in .4s ease both">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
          <div style="flex:1">
            <div style="font:700 33px/1.05 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-1.2px;color:var(--tx,#FFF6EE)">{{ t.feedH1 }}</div>
            <div style="margin-top:8px;font:400 14px/1.4 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.feedSub }}</div>
          </div>
          <div sc-camel-on-click="{{ nav.friends }}" style="width:40px;height:40px;border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(16px);border:.5px solid var(--gl,rgba(255,255,255,.14))">
            <svg width="18" height="18" sc-camel-view-box="0 0 20 20" fill="none"><path d="M7.5 9a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2ZM13.4 9.4a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2ZM2.6 16.4c0-2.7 2.2-4.4 4.9-4.4s4.9 1.7 4.9 4.4M13.6 12.2c2 .2 3.8 1.5 3.8 4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="color:var(--t2,rgba(255,238,226,.62))"></path></svg>
          </div>
        </div>
        <div style="margin-top:20px;display:flex;flex-direction:column;gap:14px">
          <sc-for list="{{ feed }}" as="f" hint-placeholder-count="4">
            <div style="border-radius:24px;overflow:hidden;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18)),var(--sh,0 14px 34px rgba(0,0,0,.45))">
              <div style="padding:13px 15px;display:flex;align-items:center;gap:11px">
                <div style="width:36px;height:36px;border-radius:99px;flex:none;background:{{ f.av }}"></div>
                <div style="flex:1;min-width:0">
                  <div style="font:600 14.5px/1.2 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--tx,#FFF6EE)">{{ f.who }}</div>
                  <div style="margin-top:3px;font:500 11.5px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t3,rgba(255,238,226,.36))">{{ f.dishName }} · {{ f.ago }}</div>
                </div>
              </div>
              <div style="height:196px;position:relative;background:{{ f.tile }}">
                <div style="position:absolute;inset:0;background:radial-gradient(120% 80% at 22% 10%,rgba(255,255,255,.26),transparent 58%)"></div>
                <div style="position:absolute;left:12px;top:12px;padding:4px 8px;border-radius:7px;background:rgba(0,0,0,.3);backdrop-filter:blur(8px);font:600 8px/1 -apple-system,system-ui;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.8)">photo</div>
              </div>
              <div style="padding:13px 15px 15px">
                <div style="font:400 14.5px/1.45 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--tx,#FFF6EE)">{{ f.body }}</div>
                <div style="margin-top:12px;display:flex;align-items:center;gap:9px">
                  <div style="display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;cursor:pointer;background:var(--fld,rgba(255,255,255,.08));border:.5px solid var(--gl,rgba(255,255,255,.14))">
                    <svg width="11" height="14" sc-camel-view-box="0 0 13 16" fill="none"><path d="M6.5 0C7.9 3 6.6 4.4 5.7 5.5c-.9 1.1-1 2.4-.1 3.2.5.4.4-1 .9-1.9.5.9 1.2 1.3 1.3 2.6.9-.6 1-1.6.9-2.4 1.5 1.1 2.3 2.7 2.3 4.3 0 2.5-2 4.7-4.5 4.7S2 13.8 2 11.3C2 7.7 6.1 6.6 6.5 0Z" fill="#FF6A2B"></path></svg>
                    <span style="font:600 12.5px/1 -apple-system,system-ui;color:var(--tx,#FFF6EE)">{{ f.likes }}</span>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;cursor:pointer;background:var(--fld,rgba(255,255,255,.08));border:.5px solid var(--gl,rgba(255,255,255,.14))">
                    <svg width="13" height="13" sc-camel-view-box="0 0 14 14" fill="none"><path d="M12.4 6.6c0 2.9-2.4 5.2-5.4 5.2-.9 0-1.7-.2-2.5-.6l-3 .9.9-2.7c-.5-.8-.8-1.7-.8-2.8 0-2.9 2.4-5.2 5.4-5.2s5.4 2.3 5.4 5.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" style="color:var(--t2,rgba(255,238,226,.62))"></path></svg>
                    <span style="font:600 12.5px/1 -apple-system,system-ui;color:var(--t2,rgba(255,238,226,.62))">12</span>
                  </div>
                </div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
      </sc-if>
