      <sc-if value="{{ s.done }}" hint-placeholder-val="{{ false }}">
      <div style="min-height:874px;padding:74px 20px 34px;box-sizing:border-box;display:flex;flex-direction:column;animation:fu-in .4s ease both">
        <div style="align-self:center;position:relative;width:168px;height:168px;display:flex;align-items:center;justify-content:center">
          <div style="position:absolute;inset:0;border-radius:99px;background:radial-gradient(circle,rgba(255,106,43,.35),transparent 68%);animation:fu-flick 2.6s ease-in-out infinite"></div>
          <div style="width:132px;height:132px;border-radius:99px;overflow:hidden;position:relative;background:linear-gradient(150deg,#8E1B0F,#E0522A);box-shadow:0 18px 46px rgba(255,80,30,.4),inset 0 2px 0 rgba(255,255,255,.4)">
            <div style="position:absolute;inset:0;background:radial-gradient(120% 80% at 26% 12%,rgba(255,255,255,.34),transparent 58%)"></div>
          </div>
          <div style="position:absolute;bottom:6px;right:6px;width:44px;height:44px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:#2E9E5B;border:3px solid var(--scr,#14100E)">
            <svg width="17" height="13" sc-camel-view-box="0 0 12 9" fill="none"><path d="M1 4.4 4.3 7.7 11 1" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </div>
        </div>
        <div style="margin-top:24px;text-align:center;font:700 33px/1.08 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-1.2px;color:var(--tx,#FFF6EE)">{{ t.doneH1 }}</div>
        <div style="margin-top:10px;text-align:center;font:400 15.5px/1.5 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.doneSub }}</div>

        <sc-if value="{{ xp }}" hint-placeholder-val="{{ true }}">
        <div style="margin-top:24px;padding:18px;border-radius:22px;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18)),var(--sh,0 14px 34px rgba(0,0,0,.45))">
          <div style="display:flex;align-items:baseline;justify-content:space-between">
            <div style="font:600 14px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--tx,#FFF6EE)">{{ t.levelNow }}</div>
            <div style="font:700 20px/1 -apple-system,system-ui;color:#F0B33C">+240</div>
          </div>
          <div style="margin-top:13px;height:8px;border-radius:9px;overflow:hidden;background:var(--hr,rgba(255,255,255,.10))">
            <div style="height:100%;width:71%;border-radius:9px;transform-origin:left;background:linear-gradient(90deg,var(--acc,#FF6A2B),#F0B33C);animation:fu-grow 1.4s cubic-bezier(.2,.85,.25,1) both"></div>
          </div>
          <div style="margin-top:9px;font:500 12px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t3,rgba(255,238,226,.36))">{{ t.toNext }}</div>
        </div>
        </sc-if>

        <div style="margin-top:12px;padding:16px;border-radius:22px;display:flex;align-items:center;gap:13px;background:linear-gradient(150deg,rgba(240,179,60,.16),rgba(255,106,43,.10));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid rgba(240,179,60,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)">
          <div style="width:46px;height:46px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#F0B33C,#D08A1E);box-shadow:0 8px 20px rgba(240,179,60,.35)">
            <svg width="20" height="20" sc-camel-view-box="0 0 16 16" fill="none"><path d="M8 1.4 9.9 5.6l4.6.5-3.4 3.1.9 4.5L8 11.5l-4 2.2.9-4.5L1.5 6.1l4.6-.5L8 1.4Z" fill="#fff"></path></svg>
          </div>
          <div style="flex:1">
            <div style="font:600 9.5px/1 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:.12em;text-transform:uppercase;color:#F0B33C">{{ t.unlocked }}</div>
            <div style="margin-top:5px;font:600 16px/1.15 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-.4px;color:var(--tx,#FFF6EE)">{{ t.badgeName }}</div>
            <div style="margin-top:4px;font:400 12.5px/1.35 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.badgeSub }}</div>
          </div>
        </div>

        <div style="margin-top:auto;display:flex;gap:10px;padding-top:26px">
          <div sc-camel-on-click="{{ nav.feed }}" style="height:56px;padding:0 22px;border-radius:18px;display:flex;align-items:center;cursor:pointer;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18));font:600 16px -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--tx,#FFF6EE)">{{ t.share }}</div>
          <div sc-camel-on-click="{{ nav.rate }}" style="flex:1;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:linear-gradient(160deg,var(--acc,#FF6A2B),#DE3A18);box-shadow:0 12px 30px rgba(255,80,30,.36),inset 0 1px 0 rgba(255,255,255,.42);font:600 17px -apple-system,system-ui,'Noto Sans Ethiopic';color:#fff">{{ t.rateIt }}</div>
        </div>
      </div>
      </sc-if>
