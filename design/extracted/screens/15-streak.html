      <sc-if value="{{ s.streak }}" hint-placeholder-val="{{ false }}">
      <div style="padding:70px 20px 130px;animation:fu-in .4s ease both">
        <div style="display:flex;align-items:center;gap:14px">
          <div style="width:56px;height:56px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--acc,#FF6A2B),#D0270F);box-shadow:0 12px 28px rgba(255,80,30,.4);animation:fu-flick 2.6s ease-in-out infinite">
            <svg width="24" height="30" sc-camel-view-box="0 0 13 16" fill="none"><path d="M6.5 0C7.9 3 6.6 4.4 5.7 5.5c-.9 1.1-1 2.4-.1 3.2.5.4.4-1 .9-1.9.5.9 1.2 1.3 1.3 2.6.9-.6 1-1.6.9-2.4 1.5 1.1 2.3 2.7 2.3 4.3 0 2.5-2 4.7-4.5 4.7S2 13.8 2 11.3C2 7.7 6.1 6.6 6.5 0Z" fill="#fff"></path></svg>
          </div>
          <div style="flex:1">
            <div style="font:700 27px/1.06 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-1px;color:var(--tx,#FFF6EE)">{{ t.streakH1 }}</div>
            <div style="margin-top:6px;font:400 14px/1.4 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.streakSub }}</div>
          </div>
        </div>

        <div style="margin-top:22px;padding:18px 16px;border-radius:24px;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18)),var(--sh,0 14px 34px rgba(0,0,0,.45))">
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:9px">
            <sc-for list="{{ dows }}" as="w" hint-placeholder-count="7">
              <div style="text-align:center;font:600 10px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t3,rgba(255,238,226,.36))">{{ w.d }}</div>
            </sc-for>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:7px">
            <sc-for list="{{ days }}" as="d" hint-placeholder-count="35">
              <div style="aspect-ratio:1;border-radius:11px;position:relative;display:flex;align-items:center;justify-content:center;background:var(--fld,rgba(255,255,255,.08))">
                <sc-if value="{{ d.on }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;border-radius:11px;background:linear-gradient(160deg,rgba(255,106,43,.85),rgba(208,39,15,.85))"></span></sc-if>
                <sc-if value="{{ d.freeze }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;border-radius:11px;background:rgba(90,150,210,.4);border:.5px solid rgba(140,190,235,.6)"></span></sc-if>
                <sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:-2px;border-radius:13px;border:2px solid var(--tx,#FFF6EE)"></span></sc-if>
                <span style="position:relative;font:600 11.5px/1 -apple-system,system-ui;color:var(--t2,rgba(255,238,226,.62))">{{ d.lbl }}</span>
              </div>
            </sc-for>
          </div>
        </div>

        <div style="margin-top:12px;padding:16px;border-radius:20px;display:flex;align-items:center;gap:12px;background:rgba(90,150,210,.12);backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid rgba(140,190,235,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)">
          <div style="width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(90,150,210,.28)">
            <svg width="18" height="18" sc-camel-view-box="0 0 18 18" fill="none"><path d="M9 1.5v15M2.5 5.2l13 7.6M15.5 5.2l-13 7.6" stroke="#8CBEEB" stroke-width="1.6" stroke-linecap="round"></path></svg>
          </div>
          <div style="flex:1">
            <div style="font:600 14.5px/1.2 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--tx,#FFF6EE)">{{ t.freeze }}</div>
            <div style="margin-top:4px;font:400 12.5px/1.35 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.freezeSub }}</div>
          </div>
        </div>
      </div>
      </sc-if>
