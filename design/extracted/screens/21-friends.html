      <sc-if value="{{ s.friends }}" hint-placeholder-val="{{ false }}">
      <div style="padding:70px 20px 130px;animation:fu-in .4s ease both">
        <div style="font:700 33px/1.05 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-1.2px;color:var(--tx,#FFF6EE)">{{ t.friendsH1 }}</div>
        <div style="margin-top:18px;padding:16px;border-radius:22px;display:flex;align-items:center;gap:13px;cursor:pointer;background:linear-gradient(150deg,rgba(255,106,43,.16),rgba(240,179,60,.08));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid rgba(255,106,43,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)">
          <div style="width:42px;height:42px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--acc,#FF6A2B),#DE3A18)">
            <svg width="17" height="17" sc-camel-view-box="0 0 16 16" fill="none"><path d="M8 2.5v11M2.5 8h11" stroke="#fff" stroke-width="2" stroke-linecap="round"></path></svg>
          </div>
          <div style="flex:1">
            <div style="font:600 15px/1.2 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--tx,#FFF6EE)">{{ t.invite }}</div>
            <div style="margin-top:4px;font:400 12.5px/1.35 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.inviteSub }}</div>
          </div>
        </div>
        <div style="margin-top:14px;border-radius:22px;overflow:hidden;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18)),var(--sh,0 14px 34px rgba(0,0,0,.45))">
          <sc-for list="{{ friends }}" as="f" hint-placeholder-count="6">
            <div style="padding:12px 15px;display:flex;align-items:center;gap:12px;border-bottom:.5px solid var(--hr,rgba(255,255,255,.10))">
              <div style="width:42px;height:42px;border-radius:99px;flex:none;background:{{ f.av }}"></div>
              <div style="flex:1;min-width:0">
                <div style="font:600 15.5px/1.2 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--tx,#FFF6EE)">{{ f.who }}</div>
                <div style="margin-top:4px;display:flex;align-items:center;gap:5px">
                  <svg width="9" height="11" sc-camel-view-box="0 0 13 16" fill="none"><path d="M6.5 0C7.9 3 6.6 4.4 5.7 5.5c-.9 1.1-1 2.4-.1 3.2.5.4.4-1 .9-1.9.5.9 1.2 1.3 1.3 2.6.9-.6 1-1.6.9-2.4 1.5 1.1 2.3 2.7 2.3 4.3 0 2.5-2 4.7-4.5 4.7S2 13.8 2 11.3C2 7.7 6.1 6.6 6.5 0Z" fill="#FF6A2B"></path></svg>
                  <span style="font:600 11.5px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t3,rgba(255,238,226,.36))">{{ f.streak }}</span>
                </div>
              </div>
              <div style="position:relative;padding:7px 14px;border-radius:999px;cursor:pointer;background:var(--fld,rgba(255,255,255,.08));border:.5px solid var(--gl,rgba(255,255,255,.14));font:600 12.5px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--tx,#FFF6EE)">
                <sc-if value="{{ f.added }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;border-radius:999px;background:rgba(46,158,91,.2);border:.5px solid rgba(46,158,91,.44)"></span></sc-if>
                <sc-if value="{{ f.added }}" hint-placeholder-val="{{ false }}"><span style="position:relative">{{ t.following }}</span></sc-if>
                <sc-if value="{{ f.notAdded }}" hint-placeholder-val="{{ true }}"><span style="position:relative">{{ t.add }}</span></sc-if>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
      </sc-if>
