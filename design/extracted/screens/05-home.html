      <sc-if value="{{ s.home }}" hint-placeholder-val="{{ true }}">
      <div style="padding:70px 0 130px;animation:fu-in .4s ease both">
        <div style="padding:0 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
          <div>
            <div style="font:400 14px/1.2 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.greeting }}</div>
            <div style="margin-top:4px;font:700 33px/1.05 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-1.2px;color:var(--tx,#FFF6EE)">{{ t.userName }}</div>
          </div>
          <div sc-camel-on-click="{{ nav.streak }}" style="display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;cursor:pointer;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18))">
            <svg width="12" height="15" sc-camel-view-box="0 0 13 16" fill="none"><path d="M6.5 0C7.9 3 6.6 4.4 5.7 5.5c-.9 1.1-1 2.4-.1 3.2.5.4.4-1 .9-1.9.5.9 1.2 1.3 1.3 2.6.9-.6 1-1.6.9-2.4 1.5 1.1 2.3 2.7 2.3 4.3 0 2.5-2 4.7-4.5 4.7S2 13.8 2 11.3C2 7.7 6.1 6.6 6.5 0Z" fill="#FF6A2B"></path></svg>
            <span style="font:700 14px/1 -apple-system,system-ui;color:var(--tx,#FFF6EE)">12</span>
          </div>
        </div>

        <div style="margin:20px 20px 0;padding:16px;border-radius:24px;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18)),var(--sh,0 14px 34px rgba(0,0,0,.45))">
          <div style="display:flex;align-items:center;gap:13px">
            <div style="width:56px;height:56px;border-radius:16px;flex:none;position:relative;overflow:hidden;background:linear-gradient(150deg,#8E1B0F,#E0522A)">
              <div style="position:absolute;inset:0;background:radial-gradient(120% 80% at 24% 12%,rgba(255,255,255,.32),transparent 58%)"></div>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font:600 10px/1 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:.1em;text-transform:uppercase;color:var(--acc,#FF6A2B)">{{ t.pickUp }}</div>
              <div style="margin-top:5px;font:600 17px/1.15 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-.4px;color:var(--tx,#FFF6EE)">{{ t.doroWat }}</div>
              <div style="margin-top:7px;height:4px;border-radius:9px;background:var(--hr,rgba(255,255,255,.10));overflow:hidden">
                <div style="height:100%;width:33%;border-radius:9px;transform-origin:left;background:linear-gradient(90deg,var(--acc,#FF6A2B),#F0B33C);animation:fu-grow 1s cubic-bezier(.3,.9,.3,1) both"></div>
              </div>
            </div>
            <div sc-camel-on-click="{{ nav.cook }}" style="width:44px;height:44px;border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:linear-gradient(160deg,var(--acc,#FF6A2B),#DE3A18);box-shadow:0 8px 20px rgba(255,80,30,.4),inset 0 1px 0 rgba(255,255,255,.4)">
              <svg width="13" height="15" sc-camel-view-box="0 0 13 15" fill="none"><path d="M2 1.6v11.8L12 7.5 2 1.6Z" fill="#fff"></path></svg>
            </div>
          </div>
        </div>

        <div style="margin:14px 20px 0;padding:15px 16px;border-radius:22px;display:flex;align-items:center;gap:13px;cursor:pointer;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18))" sc-camel-on-click="{{ nav.quests }}">
          <div style="width:34px;height:34px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(46,158,91,.18);border:.5px solid rgba(46,158,91,.4)">
            <svg width="15" height="15" sc-camel-view-box="0 0 16 16" fill="none"><path d="M8 1.4 9.9 5.6l4.6.5-3.4 3.1.9 4.5L8 11.5l-4 2.2.9-4.5L1.5 6.1l4.6-.5L8 1.4Z" stroke="#2E9E5B" stroke-width="1.4" stroke-linejoin="round"></path></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font:600 14.5px/1.2 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-.2px;color:var(--tx,#FFF6EE)">{{ t.questTitle }}</div>
            <div style="margin-top:3px;font:400 12.5px/1.3 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.questSub }}</div>
          </div>
          <sc-if value="{{ xp }}" hint-placeholder-val="{{ true }}">
            <div style="padding:5px 9px;border-radius:8px;background:rgba(240,179,60,.16);border:.5px solid rgba(240,179,60,.36);font:700 11px/1 -apple-system,system-ui;color:#F0B33C">+60 XP</div>
          </sc-if>
        </div>

        <div style="margin:26px 20px 12px;display:flex;align-items:baseline;justify-content:space-between">
          <div style="font:700 20px/1 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-.6px;color:var(--tx,#FFF6EE)">{{ t.cookTonight }}</div>
          <div sc-camel-on-click="{{ nav.search }}" style="font:500 13.5px/1 -apple-system,system-ui,'Noto Sans Ethiopic';cursor:pointer;color:var(--acc,#FF6A2B)">{{ t.seeAll }}</div>
        </div>
        <div style="display:flex;gap:12px;overflow-x:auto;padding:0 20px 4px">
          <sc-for list="{{ tonight }}" as="d" hint-placeholder-count="3">
            <div sc-camel-on-click="{{ nav.recipe }}" style="width:184px;flex:none;cursor:pointer;border-radius:22px;overflow:hidden;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18)),var(--sh,0 14px 34px rgba(0,0,0,.45))">
              <div style="height:124px;position:relative;background:{{ d.tile }}">
                <div style="position:absolute;inset:0;background:radial-gradient(120% 80% at 24% 10%,rgba(255,255,255,.30),transparent 58%)"></div>
                <div style="position:absolute;left:10px;top:10px;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.3);backdrop-filter:blur(8px);font:600 8.5px/1 -apple-system,system-ui;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.82)">photo</div>
                <sc-if value="{{ xp }}" hint-placeholder-val="{{ true }}">
                  <div style="position:absolute;right:10px;top:10px;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.34);backdrop-filter:blur(8px);font:700 10px/1 -apple-system,system-ui;color:#F0B33C">{{ d.xp }}</div>
                </sc-if>
              </div>
              <div style="padding:12px 13px 14px">
                <div style="font:600 16px/1.15 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-.4px;color:var(--tx,#FFF6EE)">{{ d.title }}</div>
                <div style="margin-top:5px;font:400 12px/1.35 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62));white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ d.sub }}</div>
                <div style="margin-top:9px;display:flex;align-items:center;gap:7px">
                  <span style="font:600 11.5px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t3,rgba(255,238,226,.36))">{{ d.time }}</span>
                  <span style="width:3px;height:3px;border-radius:9px;background:var(--t3,rgba(255,238,226,.36))"></span>
                  <span style="font:600 11.5px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t3,rgba(255,238,226,.36))">{{ d.lvl }}</span>
                </div>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="margin:26px 20px 12px;font:700 20px/1 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-.6px;color:var(--tx,#FFF6EE)">{{ t.fromRegion }}</div>
        <div sc-camel-on-click="{{ nav.region }}" style="margin:0 20px;height:140px;border-radius:24px;overflow:hidden;position:relative;cursor:pointer;background:linear-gradient(150deg,#1E5A34,#4FA766 60%,#F0B33C)">
          <div style="position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 10%,rgba(255,255,255,.28),transparent 56%)"></div>
          <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 62%)"></div>
          <div style="position:absolute;left:16px;bottom:14px;right:16px">
            <div style="font:600 9.5px/1 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.75)">{{ t.thisWeek }}</div>
            <div style="margin-top:5px;font:700 22px/1.05 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-.7px;color:#fff">{{ t.gurageTitle }}</div>
          </div>
        </div>
      </div>
      </sc-if>
