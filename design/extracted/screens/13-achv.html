      <sc-if value="{{ s.achv }}" hint-placeholder-val="{{ false }}">
      <div style="padding:70px 20px 130px;animation:fu-in .4s ease both">
        <div style="font:700 31px/1.08 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-1.1px;color:var(--tx,#FFF6EE)">{{ t.achvH1 }}</div>
        <div style="margin-top:9px;font:500 14px/1.4 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.achvSub }}</div>
        <div style="margin-top:22px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
          <sc-for list="{{ achv }}" as="a" hint-placeholder-count="9">
            <div style="display:flex;flex-direction:column;align-items:center;gap:9px">
              <div style="width:100%;aspect-ratio:1;border-radius:22px;position:relative;display:flex;align-items:center;justify-content:center;background:{{ a.tile }};border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18))">
                <sc-if value="{{ a.on }}" hint-placeholder-val="{{ true }}">
                  <svg width="30" height="30" sc-camel-view-box="0 0 16 16" fill="none"><path d="M8 1.4 9.9 5.6l4.6.5-3.4 3.1.9 4.5L8 11.5l-4 2.2.9-4.5L1.5 6.1l4.6-.5L8 1.4Z" fill="#fff" fill-opacity=".92"></path></svg>
                </sc-if>
                <sc-if value="{{ a.off }}" hint-placeholder-val="{{ false }}">
                  <svg width="20" height="24" sc-camel-view-box="0 0 16 20" fill="none" style="opacity:.4"><path d="M3.5 8.5V6a4.5 4.5 0 0 1 9 0v2.5M2.5 8.5h11v9h-11v-9Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" style="color:var(--t3,rgba(255,238,226,.36))"></path></svg>
                </sc-if>
              </div>
              <div style="text-align:center;font:500 11.5px/1.3 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ a.name }}</div>
            </div>
          </sc-for>
        </div>
      </div>
      </sc-if>
