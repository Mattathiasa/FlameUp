      <sc-if value="{{ s.shop }}" hint-placeholder-val="{{ false }}">
      <div style="padding:70px 20px 130px;animation:fu-in .4s ease both">
        <div style="font:700 33px/1.05 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-1.2px;color:var(--tx,#FFF6EE)">{{ t.shopH1 }}</div>
        <div style="margin-top:8px;font:500 13.5px/1.4 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.shopSub }}</div>
        <div style="margin-top:18px;display:flex;flex-direction:column;gap:0">
          <sc-for list="{{ shop }}" as="g" hint-placeholder-count="10">
            <sc-if value="{{ g.head }}" hint-placeholder-val="{{ false }}">
              <div style="padding:16px 6px 8px;font:600 9.5px/1 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:.13em;color:var(--t3,rgba(255,238,226,.36))">{{ g.aisle }}</div>
            </sc-if>
            <div sc-camel-on-click="{{ g.pick }}" style="margin-bottom:7px;padding:13px 15px;border-radius:16px;display:flex;align-items:center;gap:12px;cursor:pointer;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18))">
              <div style="width:22px;height:22px;border-radius:6px;flex:none;position:relative;border:1.5px solid var(--t3,rgba(255,238,226,.36));display:flex;align-items:center;justify-content:center">
                <sc-if value="{{ g.on }}" hint-placeholder-val="{{ false }}">
                  <span style="position:absolute;inset:-1.5px;border-radius:6px;background:#2E9E5B;display:flex;align-items:center;justify-content:center">
                    <svg width="11" height="8" sc-camel-view-box="0 0 12 9" fill="none"><path d="M1 4.4 4.3 7.7 11 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                  </span>
                </sc-if>
              </div>
              <div style="flex:1;font:500 15.5px/1.2 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--tx,#FFF6EE)">{{ g.name }}</div>
              <div style="font:500 14px/1.2 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ g.qty }}</div>
            </div>
          </sc-for>
        </div>
      </div>
      </sc-if>
