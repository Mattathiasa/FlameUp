      <sc-if value="{{ s.mastery }}" hint-placeholder-val="{{ false }}">
      <div style="padding:70px 20px 130px;animation:fu-in .4s ease both">
        <div style="font:700 31px/1.08 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-1.1px;color:var(--tx,#FFF6EE)">{{ t.masteryH1 }}</div>
        <div style="margin-top:10px;font:400 15px/1.5 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.masterySub }}</div>
        <div style="margin-top:22px;display:flex;flex-direction:column;gap:11px">
          <sc-for list="{{ mast }}" as="m" hint-placeholder-count="6">
            <div style="padding:16px;border-radius:22px;display:flex;align-items:center;gap:15px;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18)),var(--sh,0 14px 34px rgba(0,0,0,.45))">
              <div style="position:relative;width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center">
                <svg width="58" height="58" sc-camel-view-box="0 0 58 58" style="position:absolute;transform:rotate(-90deg)">
                  <circle cx="29" cy="29" r="26" fill="none" stroke="var(--hr,rgba(255,255,255,.10))" stroke-width="5"></circle>
                  <circle cx="29" cy="29" r="26" fill="none" stroke="{{ m.col }}" stroke-width="5" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="{{ m.dash }}"></circle>
                </svg>
                <div style="font:700 14px/1 -apple-system,system-ui;font-variant-numeric:tabular-nums;color:var(--tx,#FFF6EE)">{{ m.pct }}</div>
              </div>
              <div style="flex:1;min-width:0">
                <div style="font:600 17px/1.15 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-.4px;color:var(--tx,#FFF6EE)">{{ m.name }}</div>
                <div style="margin-top:5px;font:500 12px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t3,rgba(255,238,226,.36))">{{ m.tier }}</div>
                <div style="margin-top:9px;display:flex;gap:4px">
                  <sc-for list="{{ m.pips }}" as="p" hint-placeholder-count="5">
                    <span style="width:20px;height:4px;border-radius:9px;background:{{ p.col }}"></span>
                  </sc-for>
                </div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
      </sc-if>
