      <sc-if value="{{ s.welcome }}" hint-placeholder-val="{{ false }}">
      <div style="min-height:874px;position:relative;display:flex;flex-direction:column;animation:fu-in .4s ease both">
        <div style="position:absolute;top:0;left:0;right:0;height:560px;overflow:hidden;background:linear-gradient(165deg,#8E1B0F 0%,#E0522A 52%,#F0B33C 100%)">
          <div style="position:absolute;inset:0;background:radial-gradient(120% 70% at 22% 8%,rgba(255,255,255,.30),transparent 58%)"></div>
          <div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent 34%,var(--scr,#14100E) 96%)"></div>
          <div style="position:absolute;left:20px;top:88px;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.28);backdrop-filter:blur(10px);border:.5px solid rgba(255,255,255,.24);font:600 9.5px/1 -apple-system,system-ui;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.85)">photo · doro wat</div>
        </div>
        <div style="position:relative;margin-top:auto;padding:0 24px 46px">
          <div style="font:700 40px/1.04 -apple-system,system-ui;letter-spacing:-1.5px;color:var(--tx,#FFF6EE)">{{ t.welcomeH1 }}</div>
          <div style="margin-top:14px;font:400 16px/1.55 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62));max-width:320px">{{ t.welcomeSub }}</div>
          <div sc-camel-on-click="{{ nav.skill }}" style="margin-top:28px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:linear-gradient(160deg,var(--acc,#FF6A2B),#DE3A18);box-shadow:0 14px 34px rgba(255,80,30,.38),inset 0 1px 0 rgba(255,255,255,.42);font:600 17px -apple-system,system-ui,'Noto Sans Ethiopic';color:#fff;position:relative;overflow:hidden">
            <span style="position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);animation:fu-sheen 3.4s ease-in-out infinite"></span>
            <span style="position:relative">{{ t.getStarted }}</span>
          </div>
          <div sc-camel-on-click="{{ nav.home }}" style="margin-top:14px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18));font:600 15.5px -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--tx,#FFF6EE)">{{ t.haveAccount }}</div>
        </div>
      </div>
      </sc-if>
