      <sc-if value="{{ s.skill }}" hint-placeholder-val="{{ false }}">
      <div style="min-height:874px;padding:78px 20px 40px;box-sizing:border-box;display:flex;flex-direction:column;animation:fu-in .4s ease both">
        <div style="display:flex;gap:5px;margin-bottom:26px">
          <div style="flex:1;height:3px;border-radius:9px;background:var(--acc,#FF6A2B)"></div>
          <div style="flex:1;height:3px;border-radius:9px;background:var(--hr,rgba(255,255,255,.10))"></div>
          <div style="flex:1;height:3px;border-radius:9px;background:var(--hr,rgba(255,255,255,.10))"></div>
        </div>
        <div style="font:700 30px/1.12 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-1px;color:var(--tx,#FFF6EE)">{{ t.skillH1 }}</div>
        <div style="margin-top:10px;font:400 15px/1.5 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.skillSub }}</div>
        <div style="margin-top:26px;display:flex;flex-direction:column;gap:11px">
          <sc-for list="{{ skills }}" as="k" hint-placeholder-count="3">
            <div sc-camel-on-click="{{ k.pick }}" style="position:relative;padding:17px 18px;border-radius:20px;cursor:pointer;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18)),var(--sh,0 14px 34px rgba(0,0,0,.45))">
              <sc-if value="{{ k.on }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:-1px;border-radius:21px;border:1.5px solid var(--acc,#FF6A2B);box-shadow:0 0 0 4px rgba(255,106,43,.16)"></span></sc-if>
              <div style="position:relative;display:flex;align-items:center;gap:13px">
                <div style="width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;gap:2px;background:var(--g2,rgba(255,255,255,.12));border:.5px solid var(--gl,rgba(255,255,255,.14))">
                  <sc-for list="{{ k.pips }}" as="p" hint-placeholder-count="3">
                    <span style="width:3px;border-radius:9px;height:{{ p.h }};background:{{ p.c }}"></span>
                  </sc-for>
                </div>
                <div style="flex:1">
                  <div style="font:600 17px/1.2 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-.4px;color:var(--tx,#FFF6EE)">{{ k.title }}</div>
                  <div style="margin-top:3px;font:400 13px/1.4 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ k.sub }}</div>
                </div>
                <sc-if value="{{ k.on }}" hint-placeholder-val="{{ false }}">
                  <div style="width:24px;height:24px;border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--acc,#FF6A2B)">
                    <svg width="12" height="9" sc-camel-view-box="0 0 12 9" fill="none"><path d="M1 4.4 4.3 7.7 11 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                  </div>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="margin-top:auto;display:flex;gap:10px;padding-top:28px">
          <div sc-camel-on-click="{{ nav.home }}" style="height:52px;padding:0 20px;border-radius:16px;display:flex;align-items:center;cursor:pointer;background:var(--g1,rgba(255,255,255,.07));border:.5px solid var(--gl,rgba(255,255,255,.14));font:600 15px -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.skip }}</div>
          <div sc-camel-on-click="{{ nav.taste }}" style="flex:1;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:linear-gradient(160deg,var(--acc,#FF6A2B),#DE3A18);box-shadow:0 12px 28px rgba(255,80,30,.34),inset 0 1px 0 rgba(255,255,255,.42);font:600 16px -apple-system,system-ui,'Noto Sans Ethiopic';color:#fff">{{ t.continue }}</div>
        </div>
      </div>
      </sc-if>
