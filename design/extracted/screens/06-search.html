      <sc-if value="{{ s.search }}" hint-placeholder-val="{{ false }}">
      <div style="padding:70px 0 130px;animation:fu-in .4s ease both">
        <div style="padding:0 20px">
          <div style="font:700 33px/1.05 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-1.2px;color:var(--tx,#FFF6EE)">{{ t.tabExplore }}</div>
          <div style="margin-top:16px;height:46px;border-radius:15px;display:flex;align-items:center;gap:9px;padding:0 14px;background:var(--fld,rgba(255,255,255,.08));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18))">
            <svg width="16" height="16" sc-camel-view-box="0 0 20 20" fill="none"><path d="M9 15.5a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13ZM13.8 13.8 17.5 17.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="color:var(--t3,rgba(255,238,226,.36))"></path></svg>
            <span style="font:400 16px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t3,rgba(255,238,226,.36))">{{ t.searchPh }}</span>
          </div>
        </div>
        <div style="margin-top:14px;display:flex;gap:8px;overflow-x:auto;padding:0 20px 2px">
          <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
            <div sc-camel-on-click="{{ c.pick }}" style="flex:none;position:relative;padding:9px 14px;border-radius:999px;cursor:pointer;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(14px);border:.5px solid var(--gl,rgba(255,255,255,.14));font:500 13.5px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--tx,#FFF6EE);white-space:nowrap">
              <sc-if value="{{ c.on }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:-1px;border-radius:999px;border:1.5px solid var(--acc,#FF6A2B);background:rgba(255,106,43,.15)"></span></sc-if>
              <span style="position:relative">{{ c.label }}</span>
            </div>
          </sc-for>
        </div>
        <div style="margin:18px 20px 10px;font:600 11px/1 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:.1em;text-transform:uppercase;color:var(--t3,rgba(255,238,226,.36))">{{ t.results }}</div>
        <div style="margin:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <sc-for list="{{ grid }}" as="d" hint-placeholder-count="6">
            <div sc-camel-on-click="{{ d.go }}" style="cursor:pointer;border-radius:20px;overflow:hidden;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18)),var(--sh,0 14px 34px rgba(0,0,0,.45))">
              <div style="height:104px;position:relative;background:{{ d.tile }}">
                <div style="position:absolute;inset:0;background:radial-gradient(120% 80% at 24% 10%,rgba(255,255,255,.30),transparent 58%)"></div>
                <div style="position:absolute;left:9px;top:9px;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.3);backdrop-filter:blur(8px);font:600 8px/1 -apple-system,system-ui;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.8)">photo</div>
              </div>
              <div style="padding:10px 11px 12px">
                <div style="font:600 15px/1.15 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-.35px;color:var(--tx,#FFF6EE)">{{ d.title }}</div>
                <div style="margin-top:6px;display:flex;align-items:center;gap:6px">
                  <span style="font:600 11px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t3,rgba(255,238,226,.36))">{{ d.time }}</span>
                  <span style="width:3px;height:3px;border-radius:9px;background:var(--t3,rgba(255,238,226,.36))"></span>
                  <span style="font:600 11px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t3,rgba(255,238,226,.36))">{{ d.lvl }}</span>
                </div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
      </sc-if>
