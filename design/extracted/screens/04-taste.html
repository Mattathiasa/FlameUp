      <sc-if value="{{ s.taste }}" hint-placeholder-val="{{ false }}">
      <div style="min-height:874px;padding:78px 20px 40px;box-sizing:border-box;display:flex;flex-direction:column;animation:fu-in .4s ease both">
        <div style="display:flex;gap:5px;margin-bottom:26px">
          <div style="flex:1;height:3px;border-radius:9px;background:var(--acc,#FF6A2B)"></div>
          <div style="flex:1;height:3px;border-radius:9px;background:var(--acc,#FF6A2B)"></div>
          <div style="flex:1;height:3px;border-radius:9px;background:var(--hr,rgba(255,255,255,.10))"></div>
        </div>
        <div style="font:700 30px/1.12 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:-1px;color:var(--tx,#FFF6EE)">{{ t.tasteH1 }}</div>
        <div style="margin-top:10px;font:400 15px/1.5 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.tasteSub }}</div>

        <div style="margin-top:24px;padding:20px 18px;border-radius:22px;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(var(--blur,20px)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur,20px)) saturate(1.7);border:.5px solid var(--gl,rgba(255,255,255,.14));box-shadow:inset 0 1px 0 var(--in,rgba(255,255,255,.18)),var(--sh,0 14px 34px rgba(0,0,0,.45))">
          <div style="display:flex;align-items:baseline;justify-content:space-between">
            <div style="font:600 13px/1 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:.02em;color:var(--t2,rgba(255,238,226,.62))">{{ t.heatLevel }}</div>
            <div style="font:700 15px/1 -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--acc,#FF6A2B)">{{ heatLabel }}</div>
          </div>
          <div style="margin-top:16px;display:flex;gap:8px">
            <sc-for list="{{ heats }}" as="h" hint-placeholder-count="5">
              <div sc-camel-on-click="{{ h.pick }}" style="flex:1;height:58px;border-radius:15px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;background:var(--fld,rgba(255,255,255,.08));border:.5px solid var(--gl,rgba(255,255,255,.14))">
                <sc-if value="{{ h.on }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;border-radius:15px;background:linear-gradient(160deg,rgba(255,106,43,.9),rgba(192,48,28,.9));box-shadow:0 8px 20px rgba(255,80,30,.35)"></span></sc-if>
                <svg width="15" height="19" sc-camel-view-box="0 0 13 16" fill="none" style="position:relative"><path d="M6.5 0C7.9 3 6.6 4.4 5.7 5.5c-.9 1.1-1 2.4-.1 3.2.5.4.4-1 .9-1.9.5.9 1.2 1.3 1.3 2.6.9-.6 1-1.6.9-2.4 1.5 1.1 2.3 2.7 2.3 4.3 0 2.5-2 4.7-4.5 4.7S2 13.8 2 11.3C2 7.7 6.1 6.6 6.5 0Z" fill="{{ h.fill }}"></path></svg>
              </div>
            </sc-for>
          </div>
        </div>

        <div style="margin-top:22px;font:600 13px/1 -apple-system,system-ui,'Noto Sans Ethiopic';letter-spacing:.02em;color:var(--t2,rgba(255,238,226,.62))">{{ t.dietary }}</div>
        <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{ diets }}" as="d" hint-placeholder-count="6">
            <div sc-camel-on-click="{{ d.pick }}" style="position:relative;padding:10px 15px;border-radius:999px;cursor:pointer;background:var(--g1,rgba(255,255,255,.07));backdrop-filter:blur(14px);border:.5px solid var(--gl,rgba(255,255,255,.14));font:500 14px -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--tx,#FFF6EE)">
              <sc-if value="{{ d.on }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:-1px;border-radius:999px;border:1.5px solid var(--acc,#FF6A2B);background:rgba(255,106,43,.14)"></span></sc-if>
              <span style="position:relative">{{ d.label }}</span>
            </div>
          </sc-for>
        </div>

        <div style="margin-top:auto;display:flex;gap:10px;padding-top:28px">
          <div sc-camel-on-click="{{ nav.skill }}" style="height:52px;padding:0 20px;border-radius:16px;display:flex;align-items:center;cursor:pointer;background:var(--g1,rgba(255,255,255,.07));border:.5px solid var(--gl,rgba(255,255,255,.14));font:600 15px -apple-system,system-ui,'Noto Sans Ethiopic';color:var(--t2,rgba(255,238,226,.62))">{{ t.back }}</div>
          <div sc-camel-on-click="{{ nav.home }}" style="flex:1;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:linear-gradient(160deg,var(--acc,#FF6A2B),#DE3A18);box-shadow:0 12px 28px rgba(255,80,30,.34),inset 0 1px 0 rgba(255,255,255,.42);font:600 16px -apple-system,system-ui,'Noto Sans Ethiopic';color:#fff">{{ t.startCooking }}</div>
        </div>
      </div>
      </sc-if>
